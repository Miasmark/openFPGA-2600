name: Build Pocket core

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

# Quartus runs in the raetro/quartus:21.1 image through docker run. The job
# itself stays on the runner: that image's glibc is too old for the Node
# runtime that actions/checkout and actions/upload-artifact need.
jobs:
  # No game images, saves, firmware, release files, binaries or temporary
  # paths in the tree (sim/check/game_data.py). The names check of
  # sim/check/hygiene.sh needs a private list and stays local.
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No game data
        run: python3 -I sim/check/game_data.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quartus compile
        run: |
          docker run --rm -v "$PWD:/build" -w /build/src/fpga raetro/quartus:21.1 \
            quartus_sh --flow compile ap_core
          sudo chown -R "$(id -u):$(id -g)" src/fpga

      - name: Check timing
        working-directory: src/fpga
        run: |
          if grep -q "Timing requirements not met" output_files/ap_core.sta.rpt; then
            grep -A20 "Unconstrained\|Slow 1100mV 85C Model Setup Summary" output_files/ap_core.sta.rpt || true
            echo "::warning::Timing requirements not met"
          fi

      - name: Package
        run: tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: M_Atari2600_Pocket
          path: release/*.zip
